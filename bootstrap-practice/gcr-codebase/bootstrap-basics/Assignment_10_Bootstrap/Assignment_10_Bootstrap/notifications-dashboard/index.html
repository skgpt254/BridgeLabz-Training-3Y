<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Notifications Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="bg-dark text-white p-4">
        <div class="container">
            <h1>Notifications Dashboard</h1>
        </div>
    </header>
    <main class="container py-5">
        <section class="card shadow-sm p-4">
            <h2>Recent Notifications</h2>
            <div class="alert alert-success">Success: Your profile was updated.</div>
            <div class="alert alert-info">Tip: Complete your profile setup.</div>
            <div class="alert alert-danger">Warning: Your password expires soon.</div>
            <div class="alert alert-warning alert-dismissible fade show">Reminder: You have an unfinished task.<button
                    class="btn-close" data-bs-dismiss="alert"></button></div>
            <section class="bg-light border rounded p-4 mt-4">
                <h3>Summary</h3>
                <p>Total notifications: <b>12</b></p>
                <p class="mb-0">Unread: <b>4</b></p>
            </section>
        </section>
    </main>
    <footer class="bg-dark text-white text-center p-3">Account Notifications</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
