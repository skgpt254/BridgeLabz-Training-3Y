<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Blog Pagination</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="bg-dark text-white p-4">
        <div class="container">
            <h1>Developer Journal</h1>
            <p class="lead">Recent articles and practical notes.</p>
        </div>
    </header>
    <main class="container py-5">
        <div class="row g-4 mb-5">
            <article class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h2 class="h4">Understanding Bootstrap Grid</h2>
                        <p>Learn containers, rows and columns.</p><button class="btn btn-primary">Read Post</button>
                    </div>
                </div>
            </article>
            <article class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h2 class="h4">Responsive UI Patterns</h2>
                        <p>Practical patterns for different screens.</p><button class="btn btn-primary">Read
                            Post</button>
                    </div>
                </div>
            </article>
        </div>
        <nav>
            <ul class="pagination justify-content-center">
                <li class="page-item"><a class="page-link">Previous</a></li>
                <li class="page-item active"><a class="page-link">1</a></li>
                <li class="page-item"><a class="page-link">2</a></li>
                <li class="page-item"><a class="page-link">Next</a></li>
            </ul>
        </nav>
        <div class="d-flex justify-content-between mt-4"><button class="btn btn-outline-secondary">Older
                Posts</button><button class="btn btn-outline-secondary">Newer Posts</button></div>
    </main>
    <footer class="bg-dark text-white text-center p-3">Developer Journal</footer>
</body>

</html>
