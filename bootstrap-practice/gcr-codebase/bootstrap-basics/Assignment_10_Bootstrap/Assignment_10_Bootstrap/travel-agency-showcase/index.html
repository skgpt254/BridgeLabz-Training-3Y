<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Wanderly Travel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="bg-dark text-white p-4">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <h1>Wanderly</h1>
                <p class="mb-0">Travel farther. Experience more.</p>
            </div><button class="btn btn-primary">Book a Trip</button>
        </div>
    </header>
    <main>
        <section class="container py-4">
            <div id="dest" class="carousel slide carousel-fade shadow rounded-4 overflow-hidden"
                data-bs-ride="carousel">
                <div class="carousel-indicators"><button data-bs-target="#dest" data-bs-slide-to="0"
                        class="active"></button><button data-bs-target="#dest" data-bs-slide-to="1"></button><button
                        data-bs-target="#dest" data-bs-slide-to="2"></button></div>
                <div class="carousel-inner">
                    <div class="carousel-item active" data-bs-interval="3500"><img src="paris.svg"
                            class="d-block w-100 travel" alt="Paris">
                        <div class="carousel-caption d-block">
                            <h2>Paris</h2>
                            <p>Art, food and timeless streets.</p>
                        </div>
                    </div>
                    <div class="carousel-item" data-bs-interval="4500"><img src="bali.svg" class="d-block w-100 travel"
                            alt="Bali">
                        <div class="carousel-caption d-block">
                            <h2>Bali</h2>
                            <p>Beaches, temples and green landscapes.</p>
                        </div>
                    </div>
                    <div class="carousel-item" data-bs-interval="5500"><img src="tokyo.svg" class="d-block w-100 travel"
                            alt="Tokyo">
                        <div class="carousel-caption d-block">
                            <h2>Tokyo</h2>
                            <p>Technology, culture and unforgettable nights.</p>
                        </div>
                    </div>
                </div><button class="carousel-control-prev" data-bs-target="#dest" data-bs-slide="prev"><span
                        class="carousel-control-prev-icon"></span></button><button class="carousel-control-next"
                    data-bs-target="#dest" data-bs-slide="next"><span
                        class="carousel-control-next-icon"></span></button>
            </div>
        </section>
        <section class="container py-4">
            <div class="d-flex justify-content-between">
                <h2 class="h5">Booking Completion</h2><b>70%</b>
            </div>
            <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width:70%">70%
                </div>
            </div>
        </section>
    </main>
    <footer class="bg-dark text-white text-center p-4">hello@wanderly.example | +91 98765 43210</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
