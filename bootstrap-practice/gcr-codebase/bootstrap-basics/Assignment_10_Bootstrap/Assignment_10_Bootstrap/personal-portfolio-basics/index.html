<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Personal Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="bg-dark text-white text-center p-5">
        <h1 class="fw-bold">Sandesh Kumar</h1>
        <p class="lead mb-0">Computer Science Student & Developer</p>
    </header>
    <main class="container text-center py-5"><img src="profile.svg" class="img-fluid rounded-circle profile mb-4"
            alt="Profile">
        <h2 class="fw-bold">Hello, I'm Sandesh</h2>
        <p class="text-muted mx-auto intro">I enjoy web development, programming and building useful software.</p>
        <div class="mb-4"><button class="btn btn-primary me-2">Hire Me</button><button
                class="btn btn-outline-dark">Download CV</button></div>
        <section class="bg-light text-dark p-5 mt-4 rounded-4">
            <h3>Contact Me</h3>
            <form class="mx-auto form"><input class="form-control mb-3" placeholder="Your Name"><input
                    class="form-control mb-3" type="email" placeholder="Your Email"><textarea class="form-control mb-3"
                    rows="4" placeholder="Your Message"></textarea><button class="btn btn-primary">Send Message</button>
            </form>
        </section>
    </main>
    <footer class="bg-dark text-white text-center p-3">Portfolio © 2026</footer>
</body>

</html>
