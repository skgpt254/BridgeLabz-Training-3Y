<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="bg-dark text-white text-center p-4">
        <h1>TechCart</h1>
        <p class="mb-0">Everyday technology, simply delivered.</p>
    </header>
    <main class="container py-5">
        <div class="row g-4">
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card h-100 shadow-sm"><img src="laptop.svg" class="card-img-top product" alt="Laptop">
                    <div class="card-body">
                        <h2 class="h5">Laptop</h2>
                        <p class="text-primary fw-bold">$899</p><button class="btn btn-primary w-100">Add to
                            Cart</button>
                    </div>
                </article>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card h-100 shadow-sm"><img src="headphones.svg" class="card-img-top product"
                        alt="Headphones">
                    <div class="card-body">
                        <h2 class="h5">Headphones</h2>
                        <p class="text-primary fw-bold">$149</p><button class="btn btn-primary w-100">Add to
                            Cart</button>
                    </div>
                </article>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card h-100 shadow-sm"><img src="watch.svg" class="card-img-top product" alt="Watch">
                    <div class="card-body">
                        <h2 class="h5">Watch</h2>
                        <p class="text-primary fw-bold">$199</p><button class="btn btn-primary w-100">Add to
                            Cart</button>
                    </div>
                </article>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card h-100 shadow-sm"><img src="keyboard.svg" class="card-img-top product"
                        alt="Keyboard">
                    <div class="card-body">
                        <h2 class="h5">Keyboard</h2>
                        <p class="text-primary fw-bold">$79</p><button class="btn btn-primary w-100">Add to
                            Cart</button>
                    </div>
                </article>
            </div>
        </div>
    </main>
    <footer class="bg-dark text-white text-center p-3">TechCart © 2026</footer>
</body>

</html>
