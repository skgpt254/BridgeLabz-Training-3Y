<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="bg-dark text-white p-4">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <h1>Task Tracker</h1>
                <p class="mb-0">Manage today's priorities.</p>
            </div><span class="badge text-bg-danger fs-6">4 Pending</span>
        </div>
    </header>
    <main class="container py-5">
        <section class="card shadow-sm">
            <div class="card-body">
                <h2>My Tasks</h2>
                <div class="list-group mt-3">
                    <div class="list-group-item d-flex justify-content-between">Finish project report <span
                            class="badge text-bg-danger">High</span></div>
                    <div class="list-group-item d-flex justify-content-between">Review assignment <span
                            class="badge text-bg-warning">Medium</span></div>
                    <div class="list-group-item d-flex justify-content-between">Organize notes <span
                            class="badge text-bg-success">Low</span></div>
                    <div class="list-group-item d-flex justify-content-between">Prepare presentation <span
                            class="badge text-bg-danger">High</span></div>
                </div><button class="btn btn-success mt-4">Completed <span
                        class="badge text-bg-light text-success">8</span></button>
            </div>
        </section>
    </main>
    <footer class="bg-dark text-white text-center p-3">Task Tracker</footer>
</body>

</html>
