<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Today's Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="bg-dark text-white text-center p-4">
        <h1>Olive & Hearth</h1>
        <p class="lead mb-0">Today's Menu</p>
    </header>
    <main class="container py-5">
        <section>
            <h2 class="text-center mb-4">Menu</h2>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Dish</th>
                            <th>Category</th>
                            <th>Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Garden Pasta</td>
                            <td>Main Course</td>
                            <td>$14</td>
                        </tr>
                        <tr>
                            <td>Grilled Chicken</td>
                            <td>Main Course</td>
                            <td>$18</td>
                        </tr>
                        <tr>
                            <td>Tomato Soup</td>
                            <td>Starter</td>
                            <td>$8</td>
                        </tr>
                        <tr>
                            <td>Chocolate Tart</td>
                            <td>Dessert</td>
                            <td>$7</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <section class="row g-4 mt-4">
            <div class="col-lg-6">
                <h2>Chef's Specials</h2>
                <ul class="list-group">
                    <li class="list-group-item">Truffle Risotto <span class="badge text-bg-primary float-end">$21</span>
                    </li>
                    <li class="list-group-item">Herb Salmon <span class="badge text-bg-primary float-end">$24</span>
                    </li>
                    <li class="list-group-item">Lemon Cheesecake <span class="badge text-bg-primary float-end">$9</span>
                    </li>
                </ul>
            </div>
            <figure class="col-lg-6 text-center"><img src="food.svg" class="img-fluid rounded-4 shadow food"
                    alt="Featured dish">
                <figcaption class="mt-2 text-muted">Chef's seasonal special</figcaption>
            </figure>
        </section>
    </main>
    <footer class="bg-dark text-white text-center p-3">Olive & Hearth | 11 AM - 11 PM</footer>
</body>

</html>
