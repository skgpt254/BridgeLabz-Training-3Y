<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Multi-Step Form</title>
    <style>
        body {
            font-family: Arial;
            max-width: 560px;
            margin: 32px auto;
            padding: 0 16px
        }

        label {
            display: block;
            margin: 12px 0 5px
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 9px
        }

        .step-error {
            color: red
        }

        button {
            margin-top: 16px;
            padding: 9px 14px
        }

        pre {
            white-space: pre-wrap
        }
    </style>
</head>

<body>
    <h1>3-Step Form</h1>
    <form id="multiStepForm">
        <section class="form-step">
            <h2>Step 1: Name</h2><label for="studentName">Name</label><input id="studentName" required
                pattern="[A-Za-z ]+" title="Use letters and spaces only">
            <p class="step-error"></p><button type="button" data-next>Next</button>
        </section>
        <section class="form-step" hidden>
            <h2>Step 2: Email</h2><label for="studentEmail">Email</label><input id="studentEmail" type="email" required>
            <p class="step-error"></p><button type="button" data-back>Back</button><button type="button"
                data-next>Next</button>
        </section>
        <section class="form-step" hidden>
            <h2>Step 3: Password</h2><label for="studentPassword">Password</label><input id="studentPassword"
                type="password" minlength="6" required>
            <p class="step-error"></p><button type="button" data-back>Back</button><button type="submit">Finish</button>
        </section>
    </form>
    <section id="summarySection" hidden>
        <h2>Summary</h2>
        <pre id="summary"></pre>
    </section>
    <script src="Q3_multistep_form.js"></script>
</body>

</html>
