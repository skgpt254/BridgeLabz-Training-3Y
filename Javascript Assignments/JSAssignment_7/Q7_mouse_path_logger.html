<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mouse Coordinates</title>
    <style>
        body {
            font-family: Arial;
            margin: 32px
        }

        .tracking-box {
            width: 400px;
            height: 400px;
            max-width: 90vw;
            max-height: 90vw;
            border: 2px solid #444;
            background: #f4f4f4;
            position: relative;
            overflow: hidden
        }

        .red-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: red;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none
        }
    </style>
</head>

<body>
    <h1>Mouse Path & Coordinates</h1>
    <p>Move the mouse inside the box. Double-click to place a red dot.</p>
    <p id="coordinates">clientX: —, clientY: —</p>
    <div id="trackingBox" class="tracking-box"></div>
    <script src="Q7_mouse_path_logger.js"></script>
</body>

</html>
