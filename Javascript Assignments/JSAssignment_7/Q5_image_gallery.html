<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Image Gallery</title>
    <style>
        body {
            font-family: Arial;
            margin: 24px
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 800px
        }

        .gallery img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 6px
        }

        .modal {
            position: fixed;
            inset: 0;
            background: #000b;
            display: grid;
            place-items: center;
            padding: 20px
        }

        .modal[hidden] {
            display: none
        }

        .modal-content {
            position: relative;
            background: white;
            padding: 14px;
            max-width: 90vw;
            max-height: 90vh
        }

        .modal-content img {
            display: block;
            max-width: 85vw;
            max-height: 75vh
        }

        .modal-content button {
            margin-bottom: 8px
        }
    </style>
</head>

<body>
    <h1>Image Gallery</h1>
    <div id="gallery" class="gallery"><img src="https://picsum.photos/id/10/600/400" alt="Forest"><img
            src="https://picsum.photos/id/15/600/400" alt="Waterfall"><img src="https://picsum.photos/id/28/600/400"
            alt="Mountains"><img src="https://picsum.photos/id/42/600/400" alt="Camera"><img
            src="https://picsum.photos/id/65/600/400" alt="Flowers"><img src="https://picsum.photos/id/103/600/400"
            alt="Nature"></div>
    <div id="imageModal" class="modal" hidden>
        <div class="modal-content"><button id="modalClose" type="button">Close</button><img id="modalImage"
                alt="Expanded preview"></div>
    </div>
    <script src="Q5_image_gallery.js"></script>
</body>

</html>
