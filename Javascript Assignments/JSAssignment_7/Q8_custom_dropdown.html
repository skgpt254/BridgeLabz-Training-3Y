<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Custom Dropdown</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px
        }

        .dropdown {
            position: relative;
            display: inline-block;
            min-width: 220px
        }

        button {
            padding: 10px 14px;
            cursor: pointer
        }

        #dropdownButton {
            width: 100%;
            text-align: left
        }

        #dropdownOptions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #aaa;
            box-shadow: 0 4px 10px #0002;
            z-index: 2
        }

        #dropdownOptions button {
            display: block;
            width: 100%;
            text-align: left;
            border: 0;
            background: white
        }

        #dropdownOptions button:hover {
            background: #eee
        }

        [hidden] {
            display: none !important
        }
    </style>
</head>

<body>
    <h1>Custom Dropdown</h1>
    <div id="customDropdown" class="dropdown"><button id="dropdownButton" type="button" aria-expanded="false">Choose a
            branch</button>
        <div id="dropdownOptions" hidden><button type="button" data-value="cse">Computer Science</button><button
                type="button" data-value="ece">Electronics</button><button type="button" data-value="it">Information
                Technology</button><button type="button" data-value="me">Mechanical</button></div>
    </div>
    <script src="Q8_custom_dropdown.js"></script>
</body>

</html>
