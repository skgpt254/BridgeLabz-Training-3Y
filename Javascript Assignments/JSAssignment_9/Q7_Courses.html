<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Courses</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="Q7_Courses.js" defer></script>
</head>
<body>
  <header><h1>Search Courses</h1></header>
  <main>
    <input id="search" placeholder="Type a course name">
    <button id="clearSearch">Clear Search</button>
    <p id="count">Showing 5 courses</p>
    <section id="courseList">
      <article class="course">HTML Basics</article>
      <article class="course">CSS for Beginners</article>
      <article class="course">JavaScript Programming</article>
      <article class="course">jQuery Essentials</article>
      <article class="course">AJAX and APIs</article>
    </section>
  </main>
</body>
</html>
