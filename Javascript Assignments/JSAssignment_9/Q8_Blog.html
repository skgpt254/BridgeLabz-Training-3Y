<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Blog Posts</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="Q8_Blog.js" defer></script>
</head>
<body>
  <header><h1>Blog Admin Panel</h1></header>
  <main>
    <input id="postTitle" placeholder="Post title">
    <button id="addPost">Add New Post</button>
    <button id="featuredPost">Prepend Featured Post</button>
    <button id="removePost">Remove Last Post</button>
    <section id="posts">
      <article class="post">Learning HTML and CSS</article>
      <article class="post">JavaScript for Beginners</article>
      <article class="post">A Guide to jQuery</article>
      <article class="post">Getting Started with AJAX</article>
      <article class="post">Web Development Tips</article>
    </section>
  </main>
</body>
</html>
