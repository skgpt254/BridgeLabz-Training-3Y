<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Special Offers</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="Q4_Offers.js" defer></script>
</head>
<body>
  <header><h1>Special Offers</h1></header>
  <main>
    <section id="banners">
      <article class="banner"><h2>Offer 1</h2><p>10% discount.</p><button class="hide">Hide</button></article>
      <article class="banner"><h2>Offer 2</h2><p>Free delivery.</p><button class="hide">Hide</button></article>
      <article class="banner"><h2>Offer 3</h2><p>Buy two, get one.</p><button class="hide">Hide</button></article>
    </section>
    <button id="showAll">Show All</button>
    <button id="slideUp">Slide Up</button><button id="slideDown">Slide Down</button>
    <button id="fadeOut">Fade Out</button><button id="fadeIn">Fade In</button>
  </main>
</body>
</html>
