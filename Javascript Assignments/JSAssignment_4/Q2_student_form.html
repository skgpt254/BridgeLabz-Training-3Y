<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Registration</title>
<style>body{font-family:Arial;max-width:520px;margin:32px auto;padding:0 16px}label{display:block;margin-top:14px}input{box-sizing:border-box;width:100%;padding:9px;border:2px solid #aaa}.error{color:red}button{margin-top:18px;padding:10px}</style></head>
<body><h1>Student Registration</h1><form id="studentForm" novalidate>
<label for="name">Name</label><input id="name"><div id="nameError" class="error"></div>
<label for="email">Email</label><input id="email"><div id="emailError" class="error"></div>
<label for="phone">Phone</label><input id="phone" inputmode="numeric"><div id="phoneError" class="error"></div>
<label for="password">Password</label><input id="password" type="password"><div id="passwordError" class="error"></div>
<button>Register</button></form><p id="formResult" role="status"></p><script src="Q2_student_form_validator.js"></script></body></html>
