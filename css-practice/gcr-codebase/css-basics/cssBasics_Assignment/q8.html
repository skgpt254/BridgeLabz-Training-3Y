<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: lightgray;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: navy;
            color: white;
            padding: 15px;
        }

        .layout {
            display: flex;
            padding-top: 80px;
        }

        aside {
            width: 200px;
            height: calc(100vh - 80px);
            background-color: black;
            padding: 20px;
        }

        aside a {
            display: block;
            color: white;
            padding: 15px;
        }

        main {
            padding: 20px;
            flex: 1;
        }

        .box {
            background-color: white;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 2px 2px 10px gray;
        }

        @media (max-width: 600px) {
            .layout {
                display: block;
            }

            aside {
                width: auto;
                height: auto;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>My Dashboard</h1>
</header>

<div class="layout">

    <aside>
        <a href="#">Dashboard</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>
        <a href="#">Logout</a>
    </aside>

    <main>

        <div class="box">
            <h2>Welcome</h2>
            <p>Welcome to your dashboard.</p>
        </div>

        <div class="box">
            <h2>Statistics</h2>
            <p>Projects: 10</p>
            <p>Tasks: 4</p>
        </div>

    </main>

</div>

</body>
</html>
