<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            position: sticky;
            top: 0;
            background-color: navy;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        header a {
            color: white;
            margin: 10px;
        }

        .hero {
            height: 500px;
            background-image: linear-gradient(
                rgba(0,0,0,0.5),
                rgba(0,0,0,0.5)
            ), url("hero.jpg");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .about {
            display: flex;
            padding: 50px;
            border: 2px solid gray;
            outline: 2px solid lightgray;
        }

        .about div,
        .about img {
            width: 50%;
        }

        .about img {
            width: 300px;
        }

        .services {
            padding: 50px;
            background: linear-gradient(lightblue, lightgreen);
        }

        .boxes {
            display: flex;
        }

        .service {
            flex: 1;
            padding: 20px;
            margin: 10px;
            background-color: white;
            border: 2px solid gray;
            box-shadow: 2px 2px 10px gray;
        }

        .contact {
            padding: 50px;
            text-align: center;
        }

        input,
        textarea {
            display: block;
            width: 300px;
            padding: 10px;
            margin: 10px auto;
        }

        button {
            padding: 10px 20px;
        }

        footer {
            position: relative;
            background-color: black;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .about,
            .boxes,
            header {
                display: block;
            }

            .about div,
            .about img {
                width: 100%;
            }

            .service {
                margin: 10px 0;
            }
        }
    </style>
</head>

<body>

<header>

    <h2>My Website</h2>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

</header>

<section class="hero">

    <div>
        <h1>Welcome to My Website</h1>
        <p>Simple Website</p>
    </div>

</section>

<section class="about">

    <div>
        <h2>About Us</h2>
        <p>
            We create simple and useful websites.
        </p>
    </div>

    <img src="about.jpg" alt="About">

</section>

<section class="services">

    <h2>Our Services</h2>

    <div class="boxes">

        <div class="service">
            <h3>Web Design</h3>
            <p>We design websites.</p>
        </div>

        <div class="service">
            <h3>Development</h3>
            <p>We develop websites.</p>
        </div>

        <div class="service">
            <h3>Security</h3>
            <p>We improve website security.</p>
        </div>

    </div>

</section>

<section class="contact">

    <h2>Contact Us</h2>

    <form>
        <input type="text" placeholder="Name">
        <input type="email" placeholder="Email">
        <textarea placeholder="Message"></textarea>
        <button>Send</button>
    </form>

</section>

<footer>
    <p>Copyright 2026</p>
</footer>

</body>
</html>
