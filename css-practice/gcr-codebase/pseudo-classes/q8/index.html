<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Assignment 8 - Q8</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Box-Sizing Comparison</h1></header><main><section class="compare"><article class="box content"><h2>Default</h2><p>content-box</p><p>Width applies to content. Padding and border are added to total size.</p></article><article class="box border"><h2>Border Box</h2><p>border-box</p><p>Width includes content, padding and border, so total width remains the declared width.</p></article></section></main><footer>Box-Sizing</footer></body></html>
