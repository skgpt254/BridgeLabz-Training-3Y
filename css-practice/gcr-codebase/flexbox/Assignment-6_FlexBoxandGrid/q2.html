<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Verdana, Geneva, Tahoma, sans-serif; background-color: rgb(247,247,247); padding: 25px; }
        h1 { text-align: center; margin-bottom: 30px; }
        .gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .card { min-height: 170px; padding: 25px; border: 2px groove slategray; background-color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.3s; }
        .card:hover { transform: scale(1.05); }
        .card h3 { margin-bottom: 15px; }
    </style>
</head>
<body>
    <h1>Product Gallery</h1>
    <div class="gallery">
        <div class="card"><h3>Keyboard</h3><p>Price: ₹1200</p></div>
        <div class="card"><h3>Mouse</h3><p>Price: ₹700</p></div>
        <div class="card"><h3>Headphones</h3><p>Price: ₹1800</p></div>
        <div class="card"><h3>Webcam</h3><p>Price: ₹2200</p></div>
        <div class="card"><h3>Monitor</h3><p>Price: ₹9000</p></div>
        <div class="card"><h3>USB Hub</h3><p>Price: ₹800</p></div>
        <div class="card"><h3>Laptop Stand</h3><p>Price: ₹1000</p></div>
        <div class="card"><h3>Speaker</h3><p>Price: ₹1500</p></div>
    </div>
</body>
</html>
