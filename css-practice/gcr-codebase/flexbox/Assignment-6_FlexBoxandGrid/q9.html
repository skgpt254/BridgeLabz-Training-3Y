<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; font-family: Verdana, Geneva, Tahoma, sans-serif; }
        main { min-height: 100vh; display: flex; justify-content: center; align-items: center; background-color: rgb(247,247,247); }
        .card { width: 280px; height: 350px; perspective: 1000px; }
        .card-inner { width: 100%; height: 100%; position: relative; transition: transform 0.7s; transform-style: preserve-3d; }
        .card:hover .card-inner { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; padding: 25px; border: 2px groove slategray; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .front { background-color: blanchedalmond; }
        .front img { width: 140px; height: 170px; object-fit: cover; margin-bottom: 20px; }
        .back { background-color: khaki; transform: rotateY(180deg); gap: 15px; }
    </style>
</head>
<body>
    <main>
        <div class="card">
            <div class="card-inner">
                <div class="front"><img src="av2.jpg" alt="Profile Image"><h2>My Card</h2></div>
                <div class="back"><h2>About Me</h2><p>This is the back side of the card.</p><p>I am learning HTML and CSS.</p></div>
            </div>
        </div>
    </main>
</body>
</html>
