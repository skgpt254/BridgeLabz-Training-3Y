<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; font-family: Verdana, Geneva, Tahoma, sans-serif; }
        .dashboard { min-height: 100vh; display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 80px 1fr; gap: 15px; padding: 15px; background-color: rgb(247,247,247); }
        header { grid-column: 1 / 3; background-color: rgb(43,48,67); color: white; display: flex; justify-content: center; align-items: center; }
        aside { background-color: khaki; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        aside a { color: black; text-decoration: none; }
        main { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .box { min-height: 160px; padding: 20px; background-color: blanchedalmond; border: 2px groove slategray; display: flex; justify-content: center; align-items: center; transition: 0.3s; }
        .box1 { grid-column: span 2; background-color: darkkhaki; }
        .box:hover { transform: scale(1.03); box-shadow: 0 8px 15px rgba(0,0,0,0.25); }
    </style>
</head>
<body>
    <div class="dashboard">
        <header><h2>Dashboard</h2></header>
        <aside><h3>Menu</h3><a href="#">Home</a><a href="#">Profile</a><a href="#">Reports</a><a href="#">Settings</a></aside>
        <main>
            <div class="box box1">Overview</div>
            <div class="box">Users</div>
            <div class="box">Projects</div>
            <div class="box">Messages</div>
            <div class="box">Statistics</div>
        </main>
    </div>
</body>
</html>
