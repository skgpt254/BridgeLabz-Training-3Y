<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Borders and Padding Demonstration</h1>
    </header>

    <main>
        <section class="boxes">
            <div class="box solid">
                <h2>Solid</h2>
                <p>10px padding</p>
            </div>

            <div class="box dashed">
                <h2>Dashed</h2>
                <p>20px padding</p>
            </div>

            <div class="box double">
                <h2>Double</h2>
                <p>30px padding</p>
            </div>

            <div class="box groove">
                <h2>Groove</h2>
                <p>Rounded corners</p>
            </div>
        </section>
    </main>

    <footer>
        <p>CSS Borders and Padding</p>
    </footer>

</body>
</html>
