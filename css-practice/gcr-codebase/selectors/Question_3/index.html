<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Gradient Background Webpage</h1>
    </header>

    <main>
        <section class="linear">
            <div>
                <h2>Linear Gradient</h2>
                <p>This section uses a linear-gradient background.</p>
            </div>
        </section>

        <section class="radial">
            <div>
                <h2>Radial Gradient</h2>
                <p>This section uses a radial-gradient background.</p>
                <p>The background is fixed to create a parallax-like effect.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Gradient Background Example</p>
    </footer>

</body>
</html>
