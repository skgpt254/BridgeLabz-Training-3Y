<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Advanced CSS Selectors</h1>
    </header>

    <main>
        <section class="selector-demo">
            <h2>List of Items</h2>

            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>Flexbox</li>
                <li>Grid</li>
                <li>Responsive Design</li>
            </ul>

            <h2>Form</h2>

            <form>
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </form>

            <h2>Links</h2>

            <p class="parent">
                <span>This is inside the parent.</span>
            </p>

            <p>This paragraph is next to the heading.</p>

            <p class="link-area">
                <a href="https://example.com">HTTPS Link</a>
            </p>
        </section>
    </main>

    <footer>
        <p>Advanced CSS Selectors</p>
    </footer>

</body>
</html>
