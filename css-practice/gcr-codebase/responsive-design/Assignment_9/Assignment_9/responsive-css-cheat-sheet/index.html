<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>responsive-css-cheat-sheet</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Responsive CSS Cheat Sheet</h1>
    </header>
    <main>
        <section class="sheet">
            <article>
                <h2>Filters</h2>
                <p>filter: grayscale(100%);</p>
            </article>
            <article>
                <h2>Media Queries</h2>
                <p>@media (max-width: 700px)</p>
            </article>
            <article>
                <h2>Responsive Design</h2>
                <p>Layouts adapt to screen sizes.</p>
            </article>
            <article>
                <h2>Typography</h2>
                <p>font-size: clamp(1rem, 2vw, 1.5rem);</p>
            </article>
            <article>
                <h2>Grid</h2>
                <p>display: grid;</p>
            </article>
            <article>
                <h2>Flexbox</h2>
                <p>display: flex;</p>
            </article>
        </section>
    </main>
    <footer>Responsive CSS Reference</footer>
</body>

</html>
