<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>responsive-image-filter-gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Responsive Image Filter Gallery</h1>
    </header>
    <main>
        <section class="gallery">
            <figure><img class="f1" src="image1.svg" alt="Filter example 1">
                <figcaption>Blur</figcaption>
            </figure>
            <figure><img class="f2" src="image2.svg" alt="Filter example 2">
                <figcaption>Grayscale</figcaption>
            </figure>
            <figure><img class="f3" src="image3.svg" alt="Filter example 3">
                <figcaption>Sepia</figcaption>
            </figure>
            <figure><img class="f4" src="image4.svg" alt="Filter example 4">
                <figcaption>Brightness</figcaption>
            </figure>
            <figure><img class="f5" src="image5.svg" alt="Filter example 5">
                <figcaption>Contrast</figcaption>
            </figure>
            <figure><img class="f6" src="image6.svg" alt="Filter example 6">
                <figcaption>Hue Rotate</figcaption>
            </figure>
        </section>
    </main>
    <footer>Hover over an image to remove its filter.</footer>
</body>

</html>
